<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSSS Hoda — Shala Darpan School Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --surface:#ffffff; --surface-alt:#f0ead9; --text:#21312a; --dim:#5f6f66;
  --border:#e2dac4; --accent:#bc3f2e; --accent-text:#ffffff; --gold:#e9a13b; --gold-soft:#fbeecd;
  --ink:#173f35; --ink-deep:#102e27; --ink-text:#f4efe2;
  --warn:#b45309; --warn-bg:#fdf3e3; --danger:#b91c1c; --danger-bg:#fbeaea; --ok:#177245; --ok-bg:#e6f4ea;
  --radius:16px; --font-serif:'Source Serif 4',Georgia,serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101713; --surface:#1b241e; --surface-alt:#263128; --text:#eef2ec; --dim:#a3b3a6; --border:#37463b;
    --accent:#e0684f; --gold:#f2b33d; --gold-soft:#3a2c10; --ink:#0d2721; --ink-deep:#081b16;
    --warn:#fbbf24; --danger:#f87171; --ok:#4ade80; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-system,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.font-display{font-family:var(--font-serif)}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px}
.wrap-narrow{max-width:896px;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(23,50,40,.07)}
@media(min-width:640px){.card{padding:20px}}
.btn-primary{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:8px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(120,40,25,.28);min-height:36px}
.btn-primary:hover{opacity:.9}
.btn-ghost{display:inline-block;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:8px 20px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.btn-ghost:hover{background:var(--surface-alt)}
.btn-danger{display:inline-block;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:8px 20px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.input{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:8px 12px;font-size:14px;box-shadow:inset 0 1px 3px rgba(16,24,20,.04)}
.input:focus{border-color:var(--accent);outline:none}
label.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:4px}
.kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
.kicker-gold{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--gold)}
.sec-title{font-family:var(--font-serif);font-size:30px;font-weight:600;margin:4px 0 8px}
.sec-title .acc{font-style:italic;color:var(--accent)}
.sec-title .acc-gold{font-style:italic;color:var(--gold)}
.rule{height:4px;width:40px;border-radius:999px;background:var(--accent);margin-bottom:8px}
.stat-card{position:relative;overflow:hidden}
.stat-card:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold)}
.stat-label{font-size:12px;text-transform:uppercase;color:var(--dim)}
.stat-value{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
table.tbl th{background:var(--surface-alt);text-align:left;padding:8px;border:1px solid var(--border);font-size:12px;text-transform:uppercase;color:var(--dim)}
table.tbl td{padding:8px;border:1px solid var(--border)}
table.tbl tr:hover td{background:var(--surface-alt)}
.scrollbox{overflow:auto;max-height:75vh;border:1px solid var(--border);border-radius:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill-ok{background:var(--ok-bg);color:var(--ok)} .pill-warn{background:var(--warn-bg);color:var(--warn)} .pill-danger{background:var(--danger-bg);color:var(--danger)} .pill-dim{background:var(--surface-alt);color:var(--dim)}
.tab-btn{border:none;background:transparent;color:var(--dim);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;min-height:36px;white-space:nowrap}
.tab-btn:hover{background:var(--surface-alt)}
.tab-btn.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(120,40,25,.28)}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(120,40,25,.3);flex:none}
.mark svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8}
.grid{display:grid;gap:16px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;margin:4px 0}
.bar-row .bl{width:96px;flex:none;color:var(--dim)}
.bar-track{flex:1;height:12px;border-radius:999px;background:var(--surface-alt);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
.msg-err{background:var(--danger-bg);color:var(--danger)} .msg-ok{background:var(--ok-bg);color:var(--ok)} .msg-warn{background:var(--warn-bg);color:var(--warn)}
select.input{appearance:auto}
.small{font-size:13px;color:var(--dim)}
.hidden{display:none!important}
@media print{ .noprint{display:none!important} body{background:#fff} }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){ const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('HTTP '+r.status)); return d; }
function bookSvg(){return '<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-0.5v13c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13"/></svg>'}
let ME=null, HOME=null;

// ---------------- Public home + sign-in ----------------
async function renderPublic(){
  const d = await api('/api/home'); HOME = d.content; const C = HOME;
  const stats = C.stats.map(s=>`<div><div style="font-size:26px;font-weight:700">${esc(s.value)}</div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75">${esc(s.label)}</div></div>`).join('');
  const facts = C.factCards.map(f=>`<div style="background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(23,50,40,.05)"><div style="font-size:11px;text-transform:uppercase;color:var(--dim)">${esc(f.label)}</div><div style="font-weight:500;margin-top:2px">${esc(f.value)}</div></div>`).join('');
  const fac = C.facilities.map(f=>`<div style="background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(23,50,40,.05);display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;border-radius:999px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;color:var(--ink)">${esc(f.label[0]||'')}</div><div><div style="font-weight:500">${esc(f.label)}</div><span class="pill ${f.status==='Yes'?'pill-ok':'pill-dim'}">${f.status==='Yes'?'Yes · उपलब्ध':'No'}</span></div></div>`).join('');
  const staff = d.staff.map((t,i)=>`<div style="background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(23,50,40,.05)"><div style="font-size:12px;color:var(--dim)">${i+1}</div><div class="font-display" style="font-size:18px;font-weight:600">${esc(t.name)}</div><div class="small">${esc(t.post)}</div>${t.subject&&t.subject!=='---'?`<span class="pill" style="background:var(--gold-soft);color:var(--ink);margin-top:6px">${esc(t.subject)}</span>`:''}</div>`).join('');
  $('#app').innerHTML = `
  <header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(23,50,40,.06)">
    <div class="wrap" style="display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px">
      <div class="mark">${bookSvg()}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:16px">${esc(C.headerName)}</div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)">${esc(C.headerSub)}</div></div>
      <nav class="noprint" style="display:flex;gap:18px;align-items:center">
        <a href="#profile" style="color:var(--text);text-decoration:none;font-size:14px;font-weight:500">School Profile</a>
        <a href="#staff" style="color:var(--text);text-decoration:none;font-size:14px;font-weight:500">Staff</a>
        <a href="#contact" style="color:var(--text);text-decoration:none;font-size:14px;font-weight:500">Contact</a>
        <a href="#signin" class="btn-primary" style="text-decoration:none">Sign In</a>
      </nav>
    </div>
  </header>
  <section style="background:var(--ink);color:var(--ink-text)">
    <div class="wrap" style="display:grid;gap:24px;padding-top:36px;padding-bottom:36px" id="heroGrid">
      <div>
        <span class="pill" style="border:1px solid rgba(255,255,255,.25);color:var(--ink-text)"><span style="color:var(--gold)">●</span> ${esc(C.heroKicker)}</span>
        <h1 style="font-size:44px;line-height:1.1;margin:16px 0 10px;font-weight:800">${esc(C.heroTitleMain)} <span class="font-display" style="font-style:italic;color:var(--gold)">${esc(C.heroTitleAccent)}</span></h1>
        <p style="opacity:.9;max-width:560px">${esc(C.heroWelcome)}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px">
          <a href="#signin" class="btn-primary" style="text-decoration:none">Sign in · लॉगिन →</a>
          <a href="#profile" class="btn-ghost" style="text-decoration:none;background:transparent;color:var(--ink-text);border-color:rgba(255,255,255,.4)">School profile · विद्यालय परिचय</a>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:16px">${stats}</div>
      </div>
      <div style="position:relative;min-height:200px">
        <div style="border-radius:28px;background:linear-gradient(135deg,var(--gold-soft),var(--surface-alt));box-shadow:0 18px 40px rgba(0,0,0,.35);height:100%;min-height:230px;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 200 130" style="width:75%"><rect x="30" y="45" width="140" height="70" rx="6" fill="#173f35"/><polygon points="20,48 100,15 180,48" fill="#bc3f2e"/><rect x="88" y="80" width="24" height="35" fill="#e9a13b"/><rect x="45" y="60" width="18" height="16" fill="#fbeecd"/><rect x="137" y="60" width="18" height="16" fill="#fbeecd"/><rect x="70" y="60" width="18" height="16" fill="#fbeecd"/><rect x="112" y="60" width="18" height="16" fill="#fbeecd"/></svg>
        </div>
        <div style="position:absolute;left:10px;bottom:10px;background:var(--gold);color:var(--ink-deep);border-radius:14px;padding:10px 14px;box-shadow:0 8px 20px rgba(0,0,0,.3)">
          <div style="font-weight:700">${esc(C.heroBadgeTitle)}</div><div style="font-size:12px">${esc(C.heroBadgeSub)}</div>
        </div>
      </div>
    </div>
  </section>
  <section id="signin" style="padding:44px 0">
    <div class="wrap" style="display:grid;gap:24px" id="signinGrid">
      <div>
        <div class="kicker">${esc(C.signinKicker)}</div>
        <h2 class="sec-title">${esc(C.signinHeadingMain)} <span class="acc">${esc(C.signinHeadingAccent)}</span> ${esc(C.signinHeadingTail)}</h2>
        <div class="grid" style="gap:12px;margin-top:14px">
          <div class="card"><div class="font-display" style="font-weight:600;font-size:18px">${esc(C.staffCardTitle)}</div><p class="small">${esc(C.staffCardText)}</p></div>
          <div class="card"><div class="font-display" style="font-weight:600;font-size:18px">${esc(C.parentCardTitle)}</div><p class="small">${esc(C.parentCardText)}</p></div>
        </div>
        <p class="small" style="margin-top:12px">${esc(C.signinNote)}</p>
      </div>
      <div class="card" style="align-self:start">
        <div class="font-display" style="font-size:22px;font-weight:600;margin-bottom:12px">Sign in · लॉगिन</div>
        <form id="loginForm">
          <label class="lbl">Login ID</label><input class="input" id="loginId" required autocomplete="username">
          <label class="lbl" style="margin-top:12px">Password</label><input class="input" id="loginPw" type="password" required autocomplete="current-password">
          <div id="loginErr"></div>
          <button class="btn-primary" style="width:100%;margin-top:16px">Sign in</button>
        </form>
      </div>
    </div>
  </section>
  <section id="profile" style="padding:10px 0 30px">
    <div class="wrap">
      <div class="kicker">${esc(C.profileKicker)}</div>
      <h2 class="sec-title">${esc(C.profileHeadingMain)} <span class="acc">${esc(C.profileHeadingAccent)}</span></h2>
      <p class="small">${esc(C.profileSub)}</p>
      <p style="font-weight:600;margin:10px 0">${esc(C.schoolNameLine)}</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${facts}</div>
      <h3 class="font-display" style="margin:26px 0 10px;font-size:22px">${esc(C.facilitiesHeading)}</h3>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${fac}</div>
      <div style="background:var(--ink);color:var(--ink-text);border-radius:16px;padding:22px;margin-top:26px">
        <div class="kicker-gold">${esc(C.streamsKicker)}</div>
        ${C.streams.map(s=>`<div style="margin-top:8px"><span style="opacity:.8">${esc(s.label)}:</span> <span class="font-display" style="font-size:18px">${esc(s.value)}</span></div>`).join('')}
      </div>
    </div>
  </section>
  <section id="staff" style="padding:10px 0 36px">
    <div class="wrap">
      <div class="kicker">${esc(C.staffKicker)}</div>
      <h2 class="sec-title">${esc(C.staffHeadingMain)} <span class="acc">${esc(C.staffHeadingAccent)}</span></h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${staff}</div>
      <p class="small" style="margin-top:12px">${esc(C.staffNote)}</p>
    </div>
  </section>
  <section id="contact" style="background:var(--ink);color:var(--ink-text);padding:36px 0">
    <div class="wrap">
      <div class="kicker-gold">${esc(C.contactKicker)}</div>
      <h2 class="sec-title" style="color:var(--ink-text)">${esc(C.contactHeadingMain)} <span class="acc-gold">${esc(C.contactHeadingAccent)}</span></h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:12px">
        <div><div style="font-weight:600">${esc(C.contactAddressTitle)}</div><p style="white-space:pre-line;opacity:.9">${esc(C.contactAddress)}</p></div>
        <div><div style="font-weight:600">${esc(C.contactEmailTitle)}</div><p style="opacity:.9">${esc(C.contactEmail)}</p><div style="font-weight:600;margin-top:8px">${esc(C.contactPrincipalTitle)}</div><p style="opacity:.9">${esc(C.contactPrincipal)}</p></div>
        <div><div style="font-weight:600">${esc(C.contactCodesTitle)}</div><p style="white-space:pre-line;opacity:.9">${esc(C.contactCodes)}</p></div>
      </div>
    </div>
  </section>
  <footer style="background:var(--ink-deep);color:var(--ink-text);text-align:center;padding:20px 12px;font-size:12px">
    <div class="font-display" style="font-size:14px">${esc(C.footerLine1)}</div>
    <div style="opacity:.65;margin-top:4px">${esc(C.footerLine2)}</div>
  </footer>`;
  if (window.innerWidth >= 1024) { $('#heroGrid').style.gridTemplateColumns = '1.2fr 1fr'; $('#signinGrid').style.gridTemplateColumns = '1.1fr 1fr'; }
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ loginId: $('#loginId').value, password: $('#loginPw').value }) });
      ME = r; startShell();
    } catch (err) { $('#loginErr').innerHTML = `<div class="msg msg-err">${esc(err.message)}</div>`; }
  });
}

// ---------------- Shells ----------------
const STAFF_TABS = [
  ['dashboard','Dashboard · डैशबोर्ड'],['students','Students · विद्यार्थी'],['removed','Removed (TC/NSO) · हटाए गए'],
  ['attendance','Attendance · उपस्थिति'],['results','Results · परिणाम'],['board','Board Results · बोर्ड परिणाम'],
  ['pen','Update PEN · PEN अपडेट'],['teachers','Teachers · शिक्षक']];
const ADMIN_TABS = [['upload','Upload · अपलोड'],['admit','Admit Card · एडमिट कार्ड'],['import','Import Centre · आयात केंद्र'],['parents','Parent Logins · अभिभावक'],['accounts','Accounts · खाते'],['home','Home Page · होम पेज']];
const PARENT_TABS = [['child','My Child · मेरा बच्चा'],['presults','Results · परिणाम'],['pboard','Board Results · बोर्ड परिणाम']];
let curTab = 'dashboard', viewSession = '2026-27';

function startShell(){
  if (ME.role === 'parent') { curTab = 'child'; renderParentShell(); }
  else { curTab = 'dashboard'; renderStaffShell(); }
  if (ME.mustChange) setTimeout(()=>alert('Pehla login hai — My Account tab se apna password badal dein.'), 300);
}
function topBar(tabs, narrow){
  return `<header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)">
    <div class="${narrow?'wrap-narrow':'wrap'}">
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0">
        <div class="mark" style="width:38px;height:38px">${bookSvg()}</div>
        <div style="flex:1"><div style="font-weight:700;font-size:14px">GSSS Hoda · राजकीय उच्च माध्यमिक विद्यालय होडा</div>
        <div style="font-size:12px;color:var(--dim)">${esc(ME.name)} · ${esc(ME.role)} · ${esc(ME.loginId)}</div></div>
        <span class="pill" style="background:var(--gold-soft);color:var(--ink)">Session ${esc(viewSession)}</span>
        <button class="btn-ghost" id="signOut">Sign out</button>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;padding-bottom:8px">
        ${tabs.map(([k,l])=>`<button class="tab-btn ${curTab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}
        <button class="tab-btn ${curTab==='account'?'active':''}" data-tab="account">My Account · खाता</button>
      </div>
    </div>
  </header><main class="${narrow?'wrap-narrow':'wrap'}" style="padding-top:24px;padding-bottom:40px" id="page"></main>`;
}
function bindShell(renderFn){
  $('#signOut').onclick = async ()=>{ await api('/api/logout',{method:'POST'}); ME=null; renderPublic(); };
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ curTab=b.dataset.tab; renderFn(); });
}
function secTitle(en, hi){ return `<div class="rule"></div><h2 style="font-family:var(--font-serif);font-size:24px;margin:0 0 14px">${en} · <span style="color:var(--dim)">${hi}</span></h2>`; }
function msgBox(id){ return `<div id="${id}"></div>`; }
function showMsg(id, text, kind='ok'){ const el=document.getElementById(id); if(el) el.innerHTML = `<div class="msg msg-${kind}">${esc(text)}</div>`; }

function renderStaffShell(){
  const tabs = ME.role==='admin' ? [...STAFF_TABS, ...ADMIN_TABS] : STAFF_TABS;
  $('#app').innerHTML = topBar(tabs, false);
  bindShell(renderStaffShell);
  const fn = { dashboard: pageDashboard, students: pageStudents, removed: pageRemoved, attendance: pageAttendance, results: pageResults, board: pageBoard, pen: pagePen, teachers: pageTeachers, upload: pageUpload, admit: pageAdmit, import: pageImport, parents: pageParents, accounts: pageAccounts, home: pageHomeCms, account: pageAccount }[curTab];
  (fn||pageDashboard)();
}
function renderParentShell(){
  $('#app').innerHTML = topBar(PARENT_TABS, true);
  bindShell(renderParentShell);
  ({ child: pageMyChild, presults: pageParentResults, pboard: pageParentBoard, account: pageAccount }[curTab] || pageMyChild)();
}

// ---------------- Dashboard ----------------
async function pageDashboard(){
  const el = $('#page');
  el.innerHTML = secTitle('School Dashboard','विद्यालय डैशबोर्ड') + `
  <div class="card" style="margin-bottom:14px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    ${[['Class','classNum','<option value="">All</option>'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')],
       ['Gender','gender','<option value="">All</option><option value="M">Boys</option><option value="F">Girls</option>'],

function sdPanelHtml(kind){
  return `<div class="card" style="margin-top:14px"><h3 class="font-display">Shala Darpan Result Sheet · शाला दर्पण रिज़ल्ट शीट</h3>
  <p class="small">Portal ki marks-entry sheet (.csv / .xlsx) upload karein ya CSV paste karein — Layout A (chhoti classes) aur Layout B (Class 11–12) dono apne aap pehchane jate hain. Khaali cell = purana mark waisa hi rahega. Scanned/image PDF ke marks yahan auto-read nahi hote (Muse version me OCR hai) — PDF sirf document ke roop me rakhein, marks ke liye sheet ya grid use karein.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
    <input type="file" id="sdFile-${kind}" accept=".csv,.xlsx" class="input" style="max-width:320px">
    <button class="btn-ghost" id="sdReadFile-${kind}">Read file</button>
    <a class="btn-ghost" id="sdTemplate-${kind}" href="#" style="text-decoration:none">Download blank sheet</a>
  </div>
  <label class="lbl">Paste rows (CSV)</label>
  <textarea class="input" id="sdPaste-${kind}" rows="4" placeholder="SrNo,SRNO,Student Name,..."></textarea>
  <div style="margin-top:8px"><button class="btn-ghost" id="sdReadPaste-${kind}">Read rows</button></div>
  <div id="sdPreview-${kind}"></div></div>`;
}
async function sdRead(kind, examId, boardExamId){
  const fileIn = document.getElementById('sdFile-'+kind);
  const paste = document.getElementById('sdPaste-'+kind).value.trim();
  let payload = { examId, boardExamId };
  if (fileIn.files && fileIn.files[0]) {
    const f = fileIn.files[0];
    if (/\.xlsx$/i.test(f.name)) {
      const buf = await f.arrayBuffer();
      let bin = ''; const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      payload.xlsxBase64 = btoa(bin);
    } else { payload.csvText = await f.text(); }
  } else if (paste) payload.csvText = paste;
  else { alert('Pehle file chunein ya CSV paste karein.'); return; }
  const d = await api('/api/sd-parse', { method:'POST', body: JSON.stringify(payload) });
  renderSdPreview(kind, d, examId, boardExamId);
}
function renderSdPreview(kind, d, examId, boardExamId){
  const box = document.getElementById('sdPreview-'+kind);
  const subs = [...new Set(d.rows.flatMap(r=>Object.keys(r.marks)))];
  box.innerHTML = `<p class="small" style="margin-top:10px">Layout ${d.layout} · ${d.rows.length} rows · ${d.rows.filter(r=>r.matched).length} SRNO match</p>
  <div class="scrollbox"><table class="tbl" style="min-width:700px"><tr><th>SRNO</th><th>Student</th><th>Match</th>${subs.map(s=>`<th>${esc(s)}</th>`).join('')}</tr>
  ${d.rows.map((r,i)=>`<tr><td>${r.srno}</td><td>${esc(r.studentName||r.name)}</td><td>${r.matched?'<span class="pill pill-ok">Match</span>':'<span class="pill pill-danger">No match</span>'}</td>${subs.map(s=>`<td><input class="input sd-cell" data-i="${i}" data-sub="${esc(s)}" value="${r.marks[s]!==undefined?r.marks[s]:''}" style="width:70px"></td>`).join('')}</tr>`).join('')}</table></div>
  ${d.rows.some(r=>r.unknownSubjects && r.unknownSubjects.length)?'<p class="small">Kuch subjects is exam me nahi hain — wo Apply nahi honge (pehle exam me subject jodein).</p>':''}
  <button class="btn-primary" id="sdApply-${kind}" style="margin-top:10px">Apply bulk update</button> <span id="sdMsg-${kind}"></span>`;
  document.getElementById('sdApply-'+kind).onclick = async ()=>{
    const rows = d.rows.map((r,i)=>{ const marks = {}; $$(`.sd-cell[data-i="${i}"]`).forEach(inp=>{ if(inp.value!=='') marks[inp.dataset.sub] = Number(inp.value); }); return { srno: r.srno, matched: r.matched, marks }; });
    try { const res = await api('/api/sd-apply', { method:'POST', body: JSON.stringify({ examId, boardExamId, rows }) });
      document.getElementById('sdMsg-'+kind).innerHTML = `<span class="pill pill-ok">${res.applied} marks cells saved</span>`;
    } catch(e){ alert(e.message); }
  };
}

// ---------------- Upload + Import Centre ----------------
function importCard(title, kind, hint){
  return `<div class="card" style="margin-bottom:14px"><h3 class="font-display">${title}</h3><p class="small">${hint}</p>
  <input type="file" accept=".csv" class="input imp-file" data-kind="${kind}" style="max-width:340px">
  <button class="btn-primary imp-btn" data-kind="${kind}">Import</button> <span class="imp-msg" data-kind="${kind}"></span></div>`;
}
function bindImports(){
  $$('.imp-btn').forEach(b=>b.onclick=async()=>{
    const kind = b.dataset.kind;
    const f = $(`.imp-file[data-kind="${kind}"]`).files[0];
    if (!f) { alert('Pehle CSV file chunein.'); return; }
    const text = await f.text();
    try { const r = await api('/api/import', { method:'POST', body: JSON.stringify({ kind, csvText: text }) });
      $(`.imp-msg[data-kind="${kind}"]`).innerHTML = `<span class="pill pill-ok">${r.applied} rows import hue</span>` + (r.errors && r.errors.length ? ' <span class="pill pill-warn">' + esc(r.errors.slice(0,3).join('; ')) + '</span>' : '');
    } catch(e){ alert(e.message); }
  });
}

  $('#page').innerHTML = secTitle('Upload Centre','अपलोड केंद्र') +

}

    ${d.cards.map(c=>`<tr><td><b>${esc(c.studentName)}</b> (${c.srno})</td><td>${c.classNum||''}</td><td>${esc(c.studentStatus||'')}</td><td>${esc(c.examLabel)}</td><td>${c.hasFile?`<a href="/api/admit-cards/${c.id}/file" target="_blank">${esc(c.fileName)}</a>`:esc(c.fileName)+' <span class="pill pill-warn">file standalone me nahi</span>'}</td><td>${esc(c.uploadedDate||'')}</td><td><button class="btn-danger" data-acdel="${c.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="7">Abhi koi admit card nahi.</td></tr>'}</table>
    <p class="small" style="margin-top:8px">Merged PDF (saare students ek file me) ka auto-split Muse version me hai; standalone me ek-ek student ki card upload hoti hai.</p></div>`;
  $('#acUpload').onclick = async ()=>{
    const f = $('#acFile').files[0];
    if (!f) { showMsg('acMsg','PDF file chunein.','err'); return; }
    if (!/\.pdf$/i.test(f.name)) { showMsg('acMsg','Only PDF files can be uploaded as an admit card.','err'); return; }
    const buf = await f.arrayBuffer(); let bin = ''; const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    try { const r = await api('/api/admit-cards', { method:'POST', body: JSON.stringify({ srno: Number($('#acSrno').value), examLabel: $('#acLabel').value, fileName: f.name, dataBase64: btoa(bin) }) });
      showMsg('acMsg', r.replaced ? 'Purani card replace ho gayi.' : 'Admit card upload ho gayi.', 'ok'); pageAdmit();
    } catch(e){ showMsg('acMsg', e.message, 'err'); }
  };
  $$('[data-acdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('Ye admit card delete karein?')) return; await api('/api/admit-cards', {method:'DELETE', body: JSON.stringify({ id: Number(b.dataset.acdel) })}); pageAdmit(); });
}

// ---------------- Parent pages ----------------
let parentKids = [], curChild = null;
async function loadKids(){
  const d = await api('/api/my-children');
  parentKids = d.children;
  if (!curChild && parentKids.length) curChild = parentKids[0].srno;
}
function childChips(){
  return parentKids.length > 1 ? `<div style="display:flex;gap:6px;margin-bottom:14px">${parentKids.map(k=>`<button class="tab-btn ${curChild===k.srno?'active':''}" data-child="${k.srno}">${esc(k.name)} (Class ${k.classNum})</button>`).join('')}</div>` : '';
}
function bindChips(renderFn){ $$('[data-child]').forEach(b=>b.onclick=()=>{ curChild = Number(b.dataset.child); renderFn(); }); }
function remarkBanner(s){ return s.remark ? `<div style="border:2px solid var(--danger);background:var(--danger-bg);border-radius:12px;padding:12px 14px;margin-bottom:14px"><div style="font-weight:700;text-transform:uppercase;color:var(--danger);font-size:13px">Teacher's Remark · शिक्षक की टिप्पणी</div><div>${esc(s.remark)}</div></div>` : ''; }
async function pageMyChild(){
  await loadKids();
  const el = $('#page');
  if (!parentKids.length) { el.innerHTML = secTitle('My Child','मेरा बच्चा') + '<p>Koi bachcha linked nahi hai. School Admin se sampark karein.</p>'; return; }
  const d = await api('/api/child/' + curChild);
  const s = d.student;
  el.innerHTML = secTitle('My Child','मेरा बच्चा') + childChips() + remarkBanner(s) + `
  <div class="card"><h3 class="font-display">${esc(s.name)} · Class ${s.classNum}-${esc(s.section)}</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${[['SRNO',s.srno],['Roll',s.roll],['DOB',s.dob],['Father',s.father],['Mother',s.mother],['Category',s.category],['PEN',s.pen||'—'],['NIC Id',s.nicId||'—'],['Attendance',(s.workingDays?Math.round(s.presentDays/s.workingDays*1000)/10:0)+'% ('+s.presentDays+'/'+s.workingDays+' din)']].map(([k,v])=>`<div><span class="small">${k}</span><br><b>${esc(v)}</b></div>`).join('')}
    </div>
    ${d.monthly.length?`<h4 class="font-display" style="margin-top:14px">Monthly Attendance</h4><table class="tbl"><tr><th>Month</th><th>Working</th><th>Present</th><th>%</th></tr>${d.monthly.map(m=>`<tr><td>${esc(m.month)}</td><td>${m.workingDays}</td><td>${m.presentDays}</td><td>${m.workingDays?Math.round(m.presentDays/m.workingDays*1000)/10:0}%</td></tr>`).join('')}</table>`:''}
  </div>
  <div class="card" style="margin-top:14px"><h3 class="font-display">Admit Card · एडमिट कार्ड</h3>
    ${d.admitCards.length ? d.admitCards.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(c.examLabel||'Admit Card')} · ${esc(c.fileName)} · ${esc(c.uploadedDate||'')}</span>${c.hasFile?`<a class="btn-ghost" href="/api/admit-cards/${c.id}/file" target="_blank" style="text-decoration:none">View / Download</a>`:'<span class="pill pill-warn">File school se milegi</span>'}</div>`).join('') : '<p class="small">Abhi koi admit card nahi hai — school exam se pehle yahan upload karega.</p>'}
  </div>`;
  bindChips(pageMyChild);
}
function resultCard(r){
  if (!r.result || !r.result.hasResult) return `<div class="card" style="margin-top:12px"><b>${esc(r.exam.name)}</b> · <span class="pill pill-warn">Result not available</span></div>`;
  const x = r.result;
  return `<div class="card" style="margin-top:12px"><h3 class="font-display">${esc(r.exam.name)}</h3>
  <table class="tbl"><tr><th>Subject</th><th>Marks</th><th>Max</th></tr>
  ${r.exam.subjects.map(s=>`<tr><td>${esc(s.name)}</td><td>${x.marks[s.name]===null||x.marks[s.name]===undefined?'—':x.marks[s.name]}</td><td>${s.max}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td><b>${x.total}</b></td><td><b>${x.maxTotal}</b></td></tr></table>
  <p style="margin-top:8px"><span class="pill pill-ok">${x.pct}% · Grade ${x.grade} · ${x.division} Division</span></p></div>`;
}
async function pageParentResults(){
  await loadKids();
  const el = $('#page');
  if (!parentKids.length) { el.innerHTML = secTitle('Results','परिणाम') + '<p>Koi bachcha linked nahi hai.</p>'; return; }
  const d = await api('/api/child/' + curChild);
  const withMarks = d.results.filter(r=>r.result && r.result.hasResult);
  el.innerHTML = secTitle('Results','परिणाम') + childChips() + remarkBanner(d.student) + `
  ${withMarks.length?`<div class="card"><h3 class="font-display">Progress across exams</h3>${withMarks.map(r=>`<div class="bar-row"><span class="bl">${esc(r.exam.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.result.pct}%"></div></div><b>${r.result.pct}%</b></div>`).join('')}</div>`:''}
  <div style="margin-top:14px"><label class="lbl">Exam chunein</label><select class="input" id="pExamSel">${d.results.map((r,i)=>`<option value="${i}">${esc(r.exam.name)}</option>`).join('')}</select></div>
  <div id="pExamBody"></div>`;
  bindChips(pageParentResults);
  function show(){ const i = Number($('#pExamSel').value || 0); $('#pExamBody').innerHTML = d.results.length ? resultCard(d.results[i]) : '<p class="small" style="margin-top:12px">Abhi koi published result nahi hai.</p>'; }
  if ($('#pExamSel')) $('#pExamSel').onchange = show;
  show();
}
async function pageParentBoard(){
  await loadKids();
  const el = $('#page');
  if (!parentKids.length) { el.innerHTML = secTitle('Board Results','बोर्ड परिणाम') + '<p>Koi bachcha linked nahi hai.</p>'; return; }
  const d = await api('/api/child/' + curChild);
  el.innerHTML = secTitle('Board Results','बोर्ड परिणाम') + childChips() + remarkBanner(d.student) +
  (d.board.length ? d.board.map(r=>{
    if (!r.result || !r.result.hasResult) return `<div class="card" style="margin-top:12px"><b>Class ${r.boardExam.classNum} Board ${esc(r.boardExam.session)}</b> · <span class="pill pill-warn">Board result not published yet / marks nahi bhare</span></div>`;
    const x = r.result;
    return `<div class="card" style="margin-top:12px"><h3 class="font-display">Class ${r.boardExam.classNum} Board · ${esc(r.boardExam.session)}</h3>
    <p class="small">Board Roll No.: <b>${esc(x.boardRollNo||'—')}</b></p>
    <table class="tbl"><tr><th>Subject</th><th>Marks</th><th>Max</th></tr>
    ${r.boardExam.subjects.map(s=>`<tr><td>${esc(s.name)}</td><td>${x.marks[s.name]===null||x.marks[s.name]===undefined?'—':x.marks[s.name]}</td><td>${s.max}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${x.total}</b></td><td><b>${x.maxTotal}</b></td></tr></table>
    <p style="margin-top:8px"><span class="pill pill-ok">${x.pct}% · ${x.division} Division · ${x.status}</span></p></div>`;
  }).join('') : '<p class="small">Board result not published yet.</p>');
  bindChips(pageParentBoard);
}

  try { ME = await api('/api/me'); startShell(); }
  catch(e){ renderPublic(); }
})();
